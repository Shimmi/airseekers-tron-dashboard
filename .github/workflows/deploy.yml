name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      - run: cp dist/index.html dist/200.html

      - name: Deploy to Surge
        run: npx surge dist tron-dashboard.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Create release if tagged
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping release"
            exit 0
          fi

          LATEST_TAG=$(git tag --sort=-v:refname | head -1)

          if [ -n "$LATEST_TAG" ]; then
            CHANGELOG=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"- %s" --no-merges | grep -v "^- v[0-9]")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- v[0-9]")
          fi

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${CHANGELOG:-No changes}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
