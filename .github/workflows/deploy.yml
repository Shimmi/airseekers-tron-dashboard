name: Deploy to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ secrets.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      - run: cp dist/index.html dist/200.html

      - name: Deploy to Surge
        run: npx surge dist tron-dashboard.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Bump version and create release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -n "$LATEST_TAG" ]; then
            IFS='.' read -r major minor patch <<< "${LATEST_TAG#v}"
            NEW_VERSION="${major}.${minor}.$((patch + 1))"
          else
            NEW_VERSION="0.1.0"
          fi

          npm version "$NEW_VERSION" --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

          if [ -n "$LATEST_TAG" ]; then
            CHANGELOG=$(git log "${LATEST_TAG}..v${NEW_VERSION}" --pretty=format:"- %s" --no-merges | grep -v "^- v[0-9]")
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | grep -v "^- v[0-9]")
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes "$CHANGELOG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
